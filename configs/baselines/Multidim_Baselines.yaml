baselines:
  cfr:
    balance_strength: 0.1
    log_every: 20
    tabular:
      epochs: 120
      batch_size: 512
      hidden_dim: 256
      learning_rate: 0.001
    image:
      epochs: 30
      batch_size: 512
      hidden_dim: 512
      learning_rate: 0.0005
  ganite:
    adversarial_strength: 0.02
    log_every: 20
    tabular:
      epochs: 120
      batch_size: 128
      hidden_dim: 256
      learning_rate: 0.001
    image:
      epochs: 30
      batch_size: 512
      hidden_dim: 512
      learning_rate: 0.0005
  cevae:
    beta_kl: 0.1
    x_reconstruction_weight: 0.1
    log_every: 20
    tabular:
      epochs: 120
      batch_size: 512
      hidden_dim: 256
      learning_rate: 0.001
      z_dim: 32
    image:
      epochs: 30
      batch_size: 512
      hidden_dim: 512
      learning_rate: 0.0005
      z_dim: 64
  evaluation:
    tabular:
      batch_size: 512
      sliced_wasserstein_projections: 200
      cevae_samples: 20
    image:
      batch_size: 256
      sliced_wasserstein_projections: 100
      cevae_samples: 5
