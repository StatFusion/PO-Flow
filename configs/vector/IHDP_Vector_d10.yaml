# CANONICAL FINAL CONFIG — IHDP-Vector dY=10 PO-Flow+IPW (paper seeds 42--46).
# This is the safety-retained architecture-v2 configuration, not a v3 challenger.
# GPU login/setup (deanonymized):
#   ssh atl1-1-02-007-31-0
#   module load anaconda3/2022.05
#   conda activate /storage/home/hcoda1/3/dwu381/r-yxie77-0/dongze
#   cd /storage/home/hcoda1/3/dwu381/r-yxie77-0/PO_Flow
# Run the five final seeds:
#   python run_tuned_ipw.py run --datasets IHDP_Vector_d10 --seeds 42,43,44,45,46 --jobs 1
# Single-seed direct call:
#   python main_multidim.py --config /storage/home/hcoda1/3/dwu381/r-yxie77-0/PO_Flow/configs/vector/IHDP_Vector_d10.yaml --run-name FinalIPW_IHDP_Vector_d10_seed42 --seed 42 --device cuda

seed: 42
data:
  name: IHDP_Vector_d10
  archive: multidim_benchmarks/processed/ihdp_vector_d10.npz
  image_scale: false
training:
  epochs: 180
  batch_size: 150
  learning_rate: 0.0005
  hidden_dim: 128
  swa_start_fraction: 0.75
  log_every: 20
  architecture: time_residual
  core_width: 192
  depth: 3
  time_embedding_dim: 32
  residual_expansion: 2
  dropout: 0.0
  head_mode: separate
  optimizer: adamw
  weight_decay: 1.0e-05
  scheduler: cosine
  minimum_learning_rate: 1.0e-05
  max_grad_norm: 5.0
ipw:
  model: logistic
  crossfit_folds: 5
  calibration: none
  propensity_clip: 0.01
  stabilized: false
  normalize: true
  arm_normalize: false
  weight_clip_quantile: 0.95
  weight_clip_max: null
  ipw_strength: 0.5
evaluation:
  samples: 100
  batch_size: 150
  ode_steps: 100
  sliced_wasserstein_projections: 200
